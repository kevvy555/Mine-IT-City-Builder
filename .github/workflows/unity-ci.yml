name: Unity Android CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'
    paths:
      - 'MineITCityBuilder/**'
      - 'config/unity.lock.json'
      - 'config/universe.lock.json'
      - 'config/universe.import.json'
      - 'config/android-dev-signing.json'
      - 'tools/universe_import.py'
      - 'tools/prepare_locked_universe.sh'
      - 'tools/tests/**'
      - '.github/workflows/unity-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'MineITCityBuilder/**'
      - 'config/unity.lock.json'
      - 'config/universe.lock.json'
      - 'config/universe.import.json'
      - 'config/android-dev-signing.json'
      - 'tools/universe_import.py'
      - 'tools/prepare_locked_universe.sh'
      - 'tools/tests/**'
      - '.github/workflows/unity-ci.yml'
  workflow_dispatch:

concurrency:
  group: unity-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  sanity:
    name: Validate pinned project and canon
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project and package lock
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          root = Path(".")
          lock = json.loads((root / "config/unity.lock.json").read_text())
          manifest = json.loads((root / "MineITCityBuilder/Packages/manifest.json").read_text())
          project_version = (root / "MineITCityBuilder/ProjectSettings/ProjectVersion.txt").read_text()

          expected_unity = lock["unityEditor"]
          if f"m_EditorVersion: {expected_unity}" not in project_version:
              raise SystemExit(f"ProjectVersion does not match pinned Unity {expected_unity}")

          for package, version in lock["packages"].items():
              actual = manifest["dependencies"].get(package)
              if actual != version:
                  raise SystemExit(
                      f"{package}: manifest={actual!r}, lock={version!r}"
                  )

          tracked = subprocess.run(
              ["git", "ls-files", "MineITCityBuilder/Assets/Game/Generated"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          if tracked:
              raise SystemExit(
                  "Generated runtime assets must not be committed:\n" + tracked
              )

          universe_lock = json.loads((root / "config/universe.lock.json").read_text())
          if len(universe_lock.get("commit", "")) != 40:
              raise SystemExit("Universe lock must pin an exact 40-character SHA.")

          print(
              f"Unity {expected_unity} and Universe {universe_lock['commit']} locks are structurally valid."
          )
          PY

      - name: Test Universe importer validators
        run: python3 -m unittest discover -s tools/tests -p 'test_universe_import.py'

      - name: Fetch and import locked Universe
        shell: bash
        run: tools/prepare_locked_universe.sh "$RUNNER_TEMP/mineit-universe"

      - name: Verify deterministic canon output
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/canon-repro"
          python3 tools/universe_import.py             --source "$RUNNER_TEMP/mineit-universe"             --output "$RUNNER_TEMP/canon-repro"
          cmp MineITCityBuilder/Assets/Game/Generated/Resources/Canon/canon.catalog.json "$RUNNER_TEMP/canon-repro/canon.catalog.json"
          cmp MineITCityBuilder/Assets/Game/Generated/Resources/Canon/atlas.index.json "$RUNNER_TEMP/canon-repro/atlas.index.json"
          cmp MineITCityBuilder/Assets/Game/Generated/Resources/Canon/canon.provenance.json "$RUNNER_TEMP/canon-repro/canon.provenance.json"
          cat MineITCityBuilder/Assets/Game/Generated/Resources/Canon/canon.provenance.json

  editmode-tests:
    name: Unity EditMode tests
    needs: sanity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Unity EditMode cache
        uses: actions/cache@v4
        with:
          path: |
            MineITCityBuilder/Library
            MineITCityBuilder/Assets/Game/Generated
          key: unity-editmode-v1-${{ runner.os }}-6000.3.25f1-${{ hashFiles('MineITCityBuilder/Packages/**', 'MineITCityBuilder/ProjectSettings/**', 'config/unity.lock.json', 'config/universe.lock.json') }}-${{ github.sha }}
          restore-keys: |
            unity-editmode-v1-${{ runner.os }}-6000.3.25f1-${{ hashFiles('MineITCityBuilder/Packages/**', 'MineITCityBuilder/ProjectSettings/**', 'config/unity.lock.json', 'config/universe.lock.json') }}-

      - name: Fetch and import locked Universe
        shell: bash
        run: tools/prepare_locked_universe.sh "$RUNNER_TEMP/mineit-universe"

      - name: Verify Unity activation secrets
        shell: bash
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [[ -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" ]]; then
            echo "::error::Unity Personal activation is not configured. Add UNITY_EMAIL and UNITY_PASSWORD as repository Actions secrets."
            exit 1
          fi
          echo "Unity Personal activation credentials are configured."

      - name: Run EditMode tests
        id: tests
        uses: game-ci/unity-test-runner@v4.4.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: MineITCityBuilder
          unityVersion: 6000.3.25f1
          cliVersion: v0.1.72
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: MineIT City Builder EditMode

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-editmode-results-${{ github.run_number }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 14

  android-apk:
    name: Build Android APK
    needs: editmode-tests
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Unity Android cache
        uses: actions/cache@v4
        with:
          path: |
            MineITCityBuilder/Library
            MineITCityBuilder/Assets/Game/Generated
          key: unity-android-v1-${{ runner.os }}-6000.3.25f1-${{ hashFiles('MineITCityBuilder/Packages/**', 'MineITCityBuilder/ProjectSettings/**', 'config/unity.lock.json', 'config/universe.lock.json') }}-${{ github.sha }}
          restore-keys: |
            unity-android-v1-${{ runner.os }}-6000.3.25f1-${{ hashFiles('MineITCityBuilder/Packages/**', 'MineITCityBuilder/ProjectSettings/**', 'config/unity.lock.json', 'config/universe.lock.json') }}-

      - name: Fetch and import locked Universe
        shell: bash
        run: tools/prepare_locked_universe.sh "$RUNNER_TEMP/mineit-universe"

      - name: Write CI build context
        shell: bash
        run: |
          mkdir -p MineITCityBuilder/Library/MineIT
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          context = {
              "runNumber": os.environ["GITHUB_RUN_NUMBER"],
              "gitSha": os.environ["GITHUB_SHA"],
          }
          path = Path("MineITCityBuilder/Library/MineIT/ci-build-context.json")
          path.write_text(json.dumps(context, separators=(",", ":")), encoding="utf-8")
          print(f"Build context: run {context['runNumber']} sha {context['gitSha'][:8]}")
          PY

      - name: Install pinned GameCI CLI
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/game-ci/bin"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/game-ci/game-ci.tar.gz" \
            "https://github.com/game-ci/cli/releases/download/v0.1.72/game-ci-linux-x64.tar.gz"
          echo "1de550a620ee92e05e920b6db7d431621440b60b2577f04b4a997dc92a58cb0a  $RUNNER_TEMP/game-ci/game-ci.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/game-ci/game-ci.tar.gz" -C "$RUNNER_TEMP/game-ci/bin"
          chmod +x "$RUNNER_TEMP/game-ci/bin/game-ci"
          echo "$RUNNER_TEMP/game-ci/bin" >> "$GITHUB_PATH"

      - name: Build Android bootstrap APK
        shell: bash
        env:
          GAME_CI_UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          GAME_CI_UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set +e
          game-ci build MineITCityBuilder \
            --engine unity \
            --engine-version 6000.3.25f1 \
            --target-platform Android \
            --build-method MineIT.CityBuilder.Editor.BootstrapBuild.BuildAndroid
          game_ci_exit=$?
          set -e

          apk="$(find build/Android -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "$apk" ]]; then
            echo "::error::Android build did not produce an APK (GameCI exit $game_ci_exit)."
            exit "$game_ci_exit"
          fi

          unzip -tqq "$apk"
          unzip -l "$apk" | grep -q 'AndroidManifest.xml'
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libunity.so'

          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner="$(find "$android_sdk/build-tools" -type f -name apksigner -print 2>/dev/null | sort -V | tail -1)"
          if [[ -z "$apksigner" ]]; then
            echo "::error::Could not locate Android apksigner to verify the development signature."
            exit 1
          fi

          signature_output="$("$apksigner" verify --print-certs "$apk")"
          echo "$signature_output"
          actual_fingerprint="$(printf '%s\n' "$signature_output" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:lower:]' '[:upper:]')"
          expected_fingerprint="$(python3 - <<'PY'
          import json
          value = json.load(open("config/android-dev-signing.json", encoding="utf-8"))["sha256Fingerprint"]
          print(value.replace(":", "").upper())
          PY
          )"
          actual_fingerprint="${actual_fingerprint//:/}"
          if [[ "$actual_fingerprint" != "$expected_fingerprint" ]]; then
            echo "::error::APK development signing fingerprint mismatch. Expected $expected_fingerprint, got $actual_fingerprint."
            exit 1
          fi

          size="$(stat -c%s "$apk")"
          if (( size < 1048576 )); then
            echo "::error::Produced APK is unexpectedly small: $size bytes."
            exit 1
          fi

          if (( game_ci_exit != 0 )); then
            echo "::warning::GameCI returned $game_ci_exit after Unity produced and validated a structurally sound APK; accepting the APK and continuing to artifact upload."
          fi

          echo "Validated APK: $apk ($size bytes)"

      - name: Upload versioned APK
        uses: actions/upload-artifact@v4
        with:
          name: MineIT-City-Builder-dev-${{ github.run_number }}
          path: build/Android/*.apk
          if-no-files-found: error
          retention-days: 14
